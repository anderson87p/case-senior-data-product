[project]
name = "case-senior-data-product"
version = "1.0.0"
description = "Data Product financeiro em Databricks com arquitetura Medallion, CDC, SCD2 e Quality Checks."
authors = [
    { name = "Anderson de Alencar Pereira", email = "andersondealencarp@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "faker==40.36.0",
    "pandas==3.0.5",
    "pyarrow==25.0.0",
    "pyyaml==6.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff>=0.12,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]
